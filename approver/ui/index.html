<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- K8-③：锁 CSP——零远程内容、无内联脚本/样式；渲染全部 textNode。 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src ipc: http://ipc.localhost" />
  <title>agent-ssh 控制台</title>
  <link rel="stylesheet" href="./ui.css" />
</head>
<body>
  <div id="app">
    <nav id="nav" aria-label="主导航">
      <div id="nav-brand">agent-ssh</div>
      <button class="nav-item" data-view="approvals">审批<span id="nav-approvals-dot" class="dot hidden"></span></button>
      <button class="nav-item" data-view="history">历史</button>
      <button class="nav-item" data-view="audit">审计</button>
      <button class="nav-item" data-view="connections">连接</button>
      <button class="nav-item" data-view="settings">设置</button>
      <div id="nav-footer">
        <p id="host-status" class="meta">Host 状态：检测中…</p>
      </div>
    </nav>
    <div id="shell">
      <header id="titlebar" data-tauri-drag-region>
        <span id="titlebar-title" data-tauri-drag-region>agent-ssh 控制台</span>
        <div id="win-controls">
          <button id="win-min" title="最小化">&#x2500;</button>
          <button id="win-max" title="最大化/还原">&#x25A1;</button>
          <button id="win-close" title="隐藏到托盘">&#x2715;</button>
        </div>
      </header>
      <main id="content">
      <section id="view-approvals" class="view">
        <h1>审批</h1>
        <div id="queue" aria-live="polite">
          <p id="empty-hint">等待审批请求…（未连接或队列为空）</p>
        </div>
      </section>
      <section id="view-history" class="view hidden">
        <h1>历史审批</h1>
        <div class="row" id="history-filters">
          <button class="filter active" data-f="all">全部</button>
          <button class="filter" data-f="approved">已批准</button>
          <button class="filter" data-f="rejected">已拒绝</button>
          <button class="filter" data-f="expired">已过期</button>
        </div>
        <div id="history-list" aria-live="polite"></div>
        <button id="history-more" class="ghost hidden">加载更多</button>
      </section>
      <section id="view-audit" class="view hidden">
        <h1>审计日志</h1>
        <div class="row" id="audit-filters">
          <input id="audit-profile" placeholder="profile（精确）" />
          <input id="audit-keyword" placeholder="命令关键词（子串）" />
          <select id="audit-decision">
            <option value="">全部决定</option>
            <option value="allow">allow</option>
            <option value="deny">deny</option>
            <option value="require-approval">require-approval</option>
          </select>
          <button id="audit-apply" class="approve small">查询</button>
        </div>
        <p id="audit-stats" class="meta"></p>
        <div id="audit-list"></div>
        <button id="audit-more" class="ghost hidden">加载更多</button>
      </section>
      <section id="view-connections" class="view hidden">
        <h1>主机管理</h1>
        <div class="row" style="justify-content: flex-start; margin-bottom: 12px;">
          <button id="host-add" class="approve small">添加主机</button>
          <button id="hosts-refresh" class="ghost small">刷新</button>
        </div>
        <div id="hosts-list" aria-live="polite"></div>
        <section class="card hidden" id="host-form-card">
          <h2 id="host-form-title">添加主机</h2>
          <div class="form-grid">
            <label>名称<input id="hf-name" placeholder="字母/数字/-/_" /></label>
            <label>主机地址<input id="hf-host" placeholder="IP 或域名" /></label>
            <label>端口<input id="hf-port" value="22" /></label>
            <label>用户<input id="hf-user" /></label>
            <label>认证方式
              <select id="hf-auth">
                <option value="password">密码</option>
                <option value="key">私钥（路径）</option>
              </select>
            </label>
            <label id="hf-secret-label">密码<input type="password" id="hf-secret" autocomplete="off" /></label>
            <label>主机组（可选）<input id="hf-group" placeholder="dev / prod…" /></label>
          </div>
          <p class="meta">密码存入 Windows 凭据管理器（不写入配置文件）；写入后需重启 Host 生效（自动提示）。</p>
          <div class="row">
            <button id="hf-cancel" class="ghost">取消</button>
            <button id="hf-save" class="approve">保存</button>
          </div>
          <p id="hf-result" class="meta"></p>
        </section>
        <h1>连接与会话</h1>
        <div id="conn-list" aria-live="polite"></div>
        <h1>配额用量（滚动 24h）</h1>
        <div id="quota-list"></div>
      </section>
      <section id="view-settings" class="view hidden">
        <h1>设置</h1>
        <section class="card">
          <h2>通用</h2>
          <label class="toggle-row"><input type="checkbox" id="set-autostart" /> 开机自启（随登录启动控制台，Host 由控制台托管拉起）</label>
          <div class="row">
            <button id="host-restart" class="ghost">重启 Host</button>
            <button id="host-openlog" class="ghost">打开 Host 日志</button>
          </div>
          <p id="set-host-info" class="meta"></p>
        </section>
        <section class="card">
          <h2>审批面状态</h2>
          <div id="surfaces-list" class="meta"></div>
        </section>
        <section class="card">
          <h2>宿主接入（Agent MCP 配置）</h2>
          <p class="meta">识别本机 Agent 宿主并一键写入 agent-ssh 的 MCP 条目（写入前自动备份，可回滚）。写入后需重启对应宿主生效。</p>
          <div class="row"><button id="agents-scan" class="approve small">扫描本机</button></div>
          <div id="agents-list"></div>
        </section>
      </section>
      </main>
    </div>
  </div>
  <!-- 纯静态脚本：渲染只用 createTextNode，无 innerHTML/eval（K8-③）。 -->
  <script type="module" src="./ui.js"></script>
</body>
</html>
