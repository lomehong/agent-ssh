<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- K8-③：锁 CSP——零远程内容、无内联脚本/样式；渲染全部 textNode。 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src ipc: http://ipc.localhost" />
  <title>agent-ssh 控制台</title>
  <link rel="stylesheet" href="./ui.css" />
</head>
<body>
  <header id="titlebar" data-tauri-drag-region>
    <span id="titlebar-title" data-tauri-drag-region>agent-ssh 控制台</span>
    <div id="win-controls">
      <button id="win-min" title="最小化">&#x2500;</button>
      <button id="win-max" title="最大化/还原">&#x25A1;</button>
      <button id="win-close" title="隐藏到托盘">&#x2715;</button>
    </div>
  </header>
  <div id="app">
    <nav id="nav" aria-label="主导航">
      <div id="nav-brand">agent-ssh</div>
      <button class="nav-item" data-view="approvals">审批<span id="nav-approvals-dot" class="dot hidden"></span></button>
      <button class="nav-item" data-view="history">历史</button>
      <button class="nav-item" data-view="audit">审计</button>
      <button class="nav-item" data-view="connections">连接</button>
      <button class="nav-item" data-view="settings">设置</button>
      <div id="nav-footer">
        <p id="host-status" class="meta">Host 状态：检测中…</p>
      </div>
    </nav>
    <main id="content">
      <section id="view-approvals" class="view">
        <h1>审批</h1>
        <div id="queue" aria-live="polite">
          <p id="empty-hint">等待审批请求…（未连接或队列为空）</p>
        </div>
      </section>
      <section id="view-history" class="view hidden">
        <h1>历史审批</h1>
        <div class="row" id="history-filters">
          <button class="filter active" data-f="all">全部</button>
          <button class="filter" data-f="approved">已批准</button>
          <button class="filter" data-f="rejected">已拒绝</button>
          <button class="filter" data-f="expired">已过期</button>
        </div>
        <div id="history-list" aria-live="polite"></div>
        <button id="history-more" class="ghost hidden">加载更多</button>
      </section>
      <section id="view-audit" class="view hidden">
        <h1>审计日志</h1>
        <div class="row" id="audit-filters">
          <input id="audit-profile" placeholder="profile（精确）" />
          <input id="audit-keyword" placeholder="命令关键词（子串）" />
          <select id="audit-decision">
            <option value="">全部决定</option>
            <option value="allow">allow</option>
            <option value="deny">deny</option>
            <option value="require-approval">require-approval</option>
          </select>
          <button id="audit-apply" class="approve small">查询</button>
        </div>
        <p id="audit-stats" class="meta"></p>
        <div id="audit-list"></div>
        <button id="audit-more" class="ghost hidden">加载更多</button>
      </section>
      <section id="view-connections" class="view hidden">
        <h1>连接与会话</h1>
        <div id="conn-list" aria-live="polite"></div>
        <h1>配额用量（滚动 24h）</h1>
        <div id="quota-list"></div>
      </section>
      <section id="view-settings" class="view hidden">
        <h1>设置</h1>
        <p class="meta">随 T-21e 落地：开机自启、口令轮换、审批面状态、宿主接入、Host 管理。</p>
      </section>
    </main>
  </div>
  <!-- 纯静态脚本：渲染只用 createTextNode，无 innerHTML/eval（K8-③）。 -->
  <script type="module" src="./ui.js"></script>
</body>
</html>
