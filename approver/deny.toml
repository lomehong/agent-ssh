# cargo-deny 配置（K2 供应链面，T-17.5a）。
# 运行：cargo deny check（CI 经 EmbarkStudios/cargo-deny-action）。
# 本文件为占位最小配置：licenses 全 allow 常用宽松族；advisories 走
# RustSec 数据库。首次 CI 运行如报配置版本不兼容，随报随修（票内登记）。

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
